<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validación de Certificados - Innovacap</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        /* ==========================================================================
           1. VARIABLES CORPORATIVAS (Alineadas con Innovacap)
           ========================================================================== */
        :root {
            --azul-innovacap: #1E40AF;  
            --verde-innovacap: #22C55E; 
            --rojo-acento: #D62728;    
            --dorado-premium: #C69214; 
            --gris-texto: #1A202C;
            --gris-suave: #F7FAFC;
            --verde-exito: #2F855A;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #E2E8F0;
            color: var(--gris-texto);
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* ==========================================================================
           2. CONTENEDOR DE HOJA ÚNICA (Estilo Diploma de Alta Seguridad)
           ========================================================================== */
        .sheet-container {
            background-color: #FFFFFF;
            width: 100%;
            max-width: 1050px;
            min-height: 780px;
            border: 15px double var(--azul-innovacap);
            border-radius: 4px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            padding: 40px 50px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Marca de agua central */
        .watermark-escudo {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 45%;
            opacity: 0.03; 
            pointer-events: none;
            z-index: 0;
        }

        .sheet-content {
            position: relative;
            z-index: 1;
            width: 100%;
        }

        /* ==========================================================================
           3. ENCABEZADO CON EL LOGO REAL INTEGRADO
           ========================================================================== */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #E2E8F0;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        .logo-innovacap-container {
            display: flex;
            align-items: center;
        }

        /* Ajuste y escalado del logo original */
        .logo-img {
            height: 75px; 
            width: auto;
            object-fit: contain;
            display: block;
        }

        .verification-badge {
            background-color: #DEF7EC;
            border: 1px solid #319795;
            color: var(--verde-exito);
            padding: 6px 15px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 900;
            letter-spacing: 1px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* ==========================================================================
           4. TITULAR DEL REGISTRO
           ========================================================================== */
        .title-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .title-section .subtitle-delgado {
            font-size: 1rem;
            font-weight: 200; 
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #718096;
            margin-bottom: 5px;
        }

        .title-section h2 {
            font-size: 2.3rem;
            font-weight: 900; 
            color: var(--azul-innovacap);
            letter-spacing: -1px;
            text-transform: uppercase;
        }

        .title-section .rut-number {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--rojo-acento);
            margin-top: 5px;
            letter-spacing: 1px;
        }

        /* ==========================================================================
           5. SECCIÓN DE CERTIFICADOS
           ========================================================================== */
        .certifications-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            margin-bottom: 35px;
        }

        .cert-box {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid #E2E8F0;
            border-top: 5px solid var(--verde-innovacap);
            border-radius: 6px;
            padding: 25px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.02);
        }

        .cert-box h3 {
            font-size: 1.15rem;
            font-weight: 900;
            color: var(--azul-innovacap);
            margin-bottom: 12px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .cert-box h3 i {
            color: var(--verde-innovacap);
        }

        .cert-box p {
            font-size: 0.9rem;
            line-height: 1.5;
            color: #4A5568;
            margin-bottom: 15px;
        }
